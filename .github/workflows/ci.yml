name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog_ci_password
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://blog:blog_ci_password@localhost:5432/blog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 + pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Enable Corepack / pin pnpm 9
        run: corepack enable && corepack use pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations to the disposable CI database
        run: pnpm db:migrate

      - name: Unit + integration tests
        run: pnpm test

      - name: Build (next build)
        run: pnpm build

      - name: Migration drift check (dry run only -- never applies to a real DB)
        run: pnpm exec drizzle-kit check

      - name: Dependency audit
        run: pnpm audit --prod

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
