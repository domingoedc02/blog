name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog_ci_password
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://blog:blog_ci_password@localhost:5432/blog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 + pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Enable Corepack / pin pnpm 9
        run: corepack enable && corepack use pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # No-op (exits 0) until BLOG-22 adds the db:migrate script and its
      # migrations -- --if-present means a brand-new scaffold-only PR isn't
      # blocked on a script that doesn't exist yet.
      - name: Apply migrations to the disposable CI database
        run: pnpm --if-present run db:migrate

      # Deliberately NOT given the app's AUTH_*/R2_*/etc. vars: tests
      # (src/lib/env.ts's own suite in particular) construct their own
      # complete/incomplete env fixtures and must not see real-looking
      # values leak in from the job env, or a "variable is missing" assertion
      # silently stops testing what it claims to.
      - name: Unit + integration tests
        run: pnpm test

      # next build needs the full env surface for src/lib/env.ts's fail-fast
      # validation to pass -- every value below is an obvious placeholder,
      # scoped to this one step only. CI never holds a real vendor
      # credential (spec/operations); production/preview values live only
      # in Vercel.
      - name: Build (next build)
        run: pnpm build
        env:
          AUTH_SECRET: ci-build-time-dummy-secret-not-real-0000000000
          AUTH_URL: http://localhost:3000
          AUTH_GOOGLE_ID: ci-dummy-google-client-id
          AUTH_GOOGLE_SECRET: ci-dummy-google-client-secret
          AUTH_GITHUB_ID: ci-dummy-github-client-id
          AUTH_GITHUB_SECRET: ci-dummy-github-client-secret
          AUTHOR_ALLOWLIST: 'google:000000000000000000000'
          SITE_URL: http://localhost:3000
          R2_ACCOUNT_ID: ci-dummy-account-id
          R2_ACCESS_KEY_ID: ci-dummy-access-key-id
          R2_SECRET_ACCESS_KEY: ci-dummy-secret-access-key
          R2_BUCKET_NAME: blog-media
          R2_PUBLIC_BASE_URL: http://localhost:9000/blog-media
          RESEND_API_KEY: ci-dummy-resend-key
          CONTACT_TO_EMAIL: author@example.com
          CONTACT_FALLBACK_EMAIL: author@example.com
          TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          UPSTASH_REDIS_REST_URL: https://ci-dummy.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-dummy-upstash-token
          UMAMI_WEBSITE_ID: 00000000-0000-0000-0000-000000000000
          UMAMI_SCRIPT_URL: https://cloud.umami.is/script.js
          CRON_SECRET: ci-dummy-cron-secret

      # Dry-run drift check only -- never applies to a real database.
      # Skipped until BLOG-22 adds src/lib/db/schema.ts; starts enforcing
      # itself automatically the moment that file exists, no follow-up
      # change needed here.
      - name: Migration drift check
        run: |
          if [ -f src/lib/db/schema.ts ]; then
            pnpm exec drizzle-kit check
          else
            echo "::notice::src/lib/db/schema.ts not present yet (BLOG-22) -- skipping drizzle-kit check"
          fi

      # --audit-level high matches this task's own design ("fails on
      # high/critical"): pnpm audit's default exits non-zero on ANY
      # severity, which would otherwise block merges on low/moderate
      # advisories a maintainer hasn't triaged yet (e.g. a dependency's
      # moderate finding with no patched release compatible with our pinned
      # major version). Renovate's vulnerabilityAlerts still opens a PR for
      # those regardless of this gate.
      #
      # Exception list: package.json "pnpm.auditConfig.ignoreGhsas".
      # Temporary: not exploitable (no sql.identifier/raw/.as on user input).
      # Tracked in BLOG-135. Remove by 2026-11-02 (end of Sprint 2).
      # (GHSA-gpj5-g38j-94v9, drizzle-orm <0.45.2.) Every other high/critical
      # advisory still fails this step.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
